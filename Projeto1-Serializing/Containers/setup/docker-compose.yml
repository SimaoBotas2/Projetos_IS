          cpus: '1'          # Número de cores (ex: 0.5, 1, 2)
          memory: 4G         # RAM máxima
        reservations:
          cpus: '1'          # Cores reservados (mínimo)
          memory: 4G         # RAM reservada (mínimo)

  main-json-250k:
